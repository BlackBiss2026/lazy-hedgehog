# Runs the checks on every push and reports Pass/Fail.
# The result appears in the Actions tab (open the latest run → Summary).
# The checks always come from the course template (lazy-hedgehog), so they are the
# same for everyone and stay up to date. Do not edit this file.
name: Grade
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use the course's current checks
        run: |
          git clone -q --depth 1 "https://github.com/${{ github.repository_owner }}/lazy-hedgehog.git" /tmp/template
          for p in tests include Makefile; do
            if [ -e "/tmp/template/$p" ]; then rm -rf "$p"; cp -r "/tmp/template/$p" "$p"; fi
          done
      - name: Run the checks
        run: ./tests/grade.sh
