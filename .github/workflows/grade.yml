# Runs the tests on every push and reports the score.
# The score appears in the Actions tab (open the latest run → Summary).
# Do not edit this file or anything in tests/ - the staff grades page
# flags repositories where they were changed.
name: Grade
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: ./tests/grade.sh
