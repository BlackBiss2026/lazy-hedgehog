# Autograding for GitHub Classroom. Generated from tests/grading.txt.
# Total: 100 points.
name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: 'Build (compiles)'
      id: build
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Build (compiles)'
        setup-command: ''
        command: 'make -s build/hedgehog'
        timeout: 2
        max-score: 5
    - name: 'No compiler warnings (-Werror)'
      id: no_warnings
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'No compiler warnings (-Werror)'
        setup-command: ''
        command: 'make -s werror'
        timeout: 2
        max-score: 5
    - name: '1x1 world and a single row'
      id: tiny
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: '1x1 world and a single row'
        setup-command: ''
        command: 'make -s build/hedgehog && tests/run_tests.sh 01_one_cell 02_one_row'
        timeout: 2
        max-score: 10
    - name: 'Small 3x3 world'
      id: small
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Small 3x3 world'
        setup-command: ''
        command: 'make -s build/hedgehog && tests/run_tests.sh 03_small'
        timeout: 2
        max-score: 10
    - name: 'Path that must go up and left'
      id: detour
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Path that must go up and left'
        setup-command: ''
        command: 'make -s build/hedgehog && tests/run_tests.sh 04_needs_detour'
        timeout: 2
        max-score: 15
    - name: 'All weights zero'
      id: all_zero
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'All weights zero'
        setup-command: ''
        command: 'make -s build/hedgehog && tests/run_tests.sh 05_all_zero'
        timeout: 2
        max-score: 5
    - name: 'Random 100x100 world (under 10 s)'
      id: random_100
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Random 100x100 world (under 10 s)'
        setup-command: ''
        command: 'make -s build/hedgehog && tests/run_tests.sh 06_random_100'
        timeout: 2
        max-score: 15
    - name: '100x100 maze (under 10 s)'
      id: maze_100
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: '100x100 maze (under 10 s)'
        setup-command: ''
        command: 'make -s build/hedgehog && tests/run_tests.sh 07_maze_100'
        timeout: 2
        max-score: 15
    - name: 'Errors: bad arguments / bad world files'
      id: errors
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Errors: bad arguments / bad world files'
        setup-command: ''
        command: 'make -s build/hedgehog && tests/run_tests.sh errors'
        timeout: 2
        max-score: 10
    - name: 'Memory: no leaks / invalid access (ASan)'
      id: memory
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: 'Memory: no leaks / invalid access (ASan)'
        setup-command: ''
        command: 'make -s build/hedgehog_asan && tests/run_tests.sh --asan 01_one_cell 03_small 04_needs_detour 06_random_100 errors'
        timeout: 2
        max-score: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        BUILD_RESULTS: "${{steps.build.outputs.result}}"
        NO_WARNINGS_RESULTS: "${{steps.no_warnings.outputs.result}}"
        TINY_RESULTS: "${{steps.tiny.outputs.result}}"
        SMALL_RESULTS: "${{steps.small.outputs.result}}"
        DETOUR_RESULTS: "${{steps.detour.outputs.result}}"
        ALL_ZERO_RESULTS: "${{steps.all_zero.outputs.result}}"
        RANDOM_100_RESULTS: "${{steps.random_100.outputs.result}}"
        MAZE_100_RESULTS: "${{steps.maze_100.outputs.result}}"
        ERRORS_RESULTS: "${{steps.errors.outputs.result}}"
        MEMORY_RESULTS: "${{steps.memory.outputs.result}}"
      with:
        runners: build,no_warnings,tiny,small,detour,all_zero,random_100,maze_100,errors,memory
